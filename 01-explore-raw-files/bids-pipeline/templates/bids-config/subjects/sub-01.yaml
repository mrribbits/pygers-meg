# =====================================================================================
#  subjects/sub-01.yaml: one recording session (this is the file you submit)
# =====================================================================================
#
#  Make one file per subject and session (copy this one, e.g. to sub-02.yaml), then run
#  (from pygers-meg's 01-explore-raw-files folder):
#      bash run_bids-pipeline.sh /jukebox/<lab>/<study>/bids-config/subjects/sub-01.yaml
#
#  Everything else (where the data are, what to run, how to process) comes from
#  ../global-study.yaml and the files it points to.
# =====================================================================================

# The study settings this session belongs to (relative to this file).
study_config: "../global-study.yaml"

# The BIDS labels: letters and digits only, in quotes. The raw data must be in
#   <sourcedata_root>/sub-<subject>/ses-<session>/raw/
# The MRI uses the same session label as the MEG.
# In a study without sessions (sessions: false, in the study: section of global-study.yaml), write
#   session: null
# and the raw data are in  <sourcedata_root>/sub-<subject>/raw/
subject: "01"
session: "01"


# -------------------------------------------------------------------------------------
#  The cMEG recordings (raw/cMEG/)
# -------------------------------------------------------------------------------------
#  The prefix is the start of each recording's folder name: <prefix>_cMEG_Data
#  (the acquisition date and time). If a prefix doesn't match, the pipeline lists the
#  prefixes it found.
cmeg:
  emptyroom_prefix: "20260929_125813"   # the empty-room (noise) recording
  task_prefix: "20260929_134022"        # the task recording (one run; see "Several runs" below)

#  Several runs of the task in this session, each its own recording (and its own .edf)?
#  Remove task_prefix above and edf_file under eye: below, and list the runs instead, in
#  order. Each run gets a run- label in the BIDS file names (sub-01_ses-01_task-..._run-01_meg.fif).
#  All runs share the empty-room recording and the head digitization above.
#    runs:
#      - run: "01"                          # letters and digits only, in quotes
#        task_prefix: "20260929_134022"     # its <prefix>_cMEG_Data folder
#        edf_file: "MP0929R1.EDF"           # its .edf in raw/eye/ (null: no eye tracking in this run)
#      - run: "02"
#        task_prefix: "20260929_141510"
#        edf_file: "MP0929R2.EDF"
#  Behavioral logs (raw/behav/): if PsychoPy wrote one set for the whole session, there's nothing
#  to add; they go into the dataset once, without a run- label. If each run has its own, add
#  behav_files: to every run, a pattern that picks that run's .csv files, e.g.
#        behav_files: "*_R1_task-oddballftcued_*.csv"


# -------------------------------------------------------------------------------------
#  The head digitization (raw/einscan/)
# -------------------------------------------------------------------------------------
einscan:
  xfm_file: "sub-01-head+helmet_dev2head_xfm.tsv"
  xyz_file: "sub-01-head+helmet_digitisation_from_mesh_3_xfmd.xyz"


# -------------------------------------------------------------------------------------
#  The eye tracking (raw/eye/)
# -------------------------------------------------------------------------------------
eye:
  # The EyeLink .edf file (one run). "auto" = the one .edf in raw/eye/ (the pipeline stops if
  # it finds none or several). Or its file name, e.g. "MP0929.EDF". With runs:, remove this:
  # each run names its own.
  edf_file: "auto"


# -------------------------------------------------------------------------------------
#  Bad channels (notebook 04)
# -------------------------------------------------------------------------------------
#  One of three forms:
#    bad_channels: ["2C[Z]", "4B[X]"]   exactly these channels
#    bad_channels: auto                 the candidates notebook 01 found
#    bad_channels:                      the candidates, adjusted:
#      auto: true
#      add: ["2C[Z]"]                     ... plus these
#      keep: ["1A[Y]"]                    ... minus these (kept good even if flagged)
#  Check notebook 01's report (Section 6.1: the candidates, each labeled flat, flat sensor,
#  noisy or marked bad in Cerca) before relying on "auto". See the README's "Bad channels".
bad_channels: []

# Why each channel is bad (written to _channels.tsv), e.g. {"2C[Z]": "flat signal"}. With
# "auto", notebook 01's reason (e.g. "noisy (robust z = +7.2)") is used unless you give one.
bad_reasons: {}


# -------------------------------------------------------------------------------------
#  The participant (participants.tsv)
# -------------------------------------------------------------------------------------
#  One value per column; every column must be described in global-study.yaml
#  (participants_columns). participant_id is added for you. Use "n/a" for unknown.
participant:
  age: 30
  sex: "female"
  handedness: "right"


# -------------------------------------------------------------------------------------
#  Changes for this session only
# -------------------------------------------------------------------------------------
#  Any processing.yaml setting, with the same names and layout, e.g. a looser sync
#  tolerance for one noisy session:
#    overrides:
#      eye_sync:
#        final_tolerance_s: 0.030
overrides: {}
