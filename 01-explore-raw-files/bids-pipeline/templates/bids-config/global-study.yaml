# =====================================================================================
#  global-study.yaml: settings for the whole study (set once)
# =====================================================================================
#
#  This folder (bids-config/) holds everything the pipeline needs to know about your
#  study. You never edit the notebooks: the pipeline reads these files and passes the
#  settings to each notebook.
#
#    global-study.yaml   this file: where the data are, what to run, job settings, and
#                        (at the end) the published dataset's description
#    processing.yaml     how each notebook processes the data (events, MRI rules, sync, ...)
#    private.yaml        DAYSBACK, the secret date shift. Keep this file private.
#    text/               long texts: README, task description, instructions, license
#    subjects/           one file per subject/session: labels, recording names, bad channels
#
#  To run one subject (on scotty, in the pygers-meg environment, from pygers-meg's
#  01-explore-raw-files folder):
#      bash run_bids-pipeline.sh /jukebox/<lab>/<study>/bids-config/subjects/sub-01.yaml
#
#  The Scully MEG lab's own settings (hardware, institution) are in
#  01-explore-raw-files/bids-pipeline/facility.yaml in the pygers-meg repository. Change any
#  of them for this study under facility_overrides: near the end of this file.
#
#  Placeholders to replace:
#    "[yourpath]" (paths, containers): before the first run. The pipeline doesn't run while
#      any setting still contains it.
#    "EDIT ME" in the published dataset's description (the end of this file) and in text/
#      (authors, release date, license text, ...): can wait until you share the dataset. The
#      pipeline runs and lists them as reminders; notebook 06 lists any that reached the
#      dataset. Fill them in, then run notebook 04 again with write_dataset_files: true.
#
#  Messages from the checks name a setting by its section and name, joined with a dot:
#  options.write_dataset_files is the write_dataset_files line in the options: section.
# =====================================================================================


# -------------------------------------------------------------------------------------
#  The study
# -------------------------------------------------------------------------------------
study:
  # The task label: the part after "task-" in every file name. Letters and digits only.
  task: "oddballftcued"

  # true = the dataset has session folders and labels: sub-01/ses-01/meg/sub-01_ses-01_...
  # false = no sessions: sub-01/meg/sub-01_task-..., and sourcedata/sub-01/raw/ (no ses-01/).
  # BIDS allows both. Set false only if every participant comes once: adding sessions to a
  # study later means renaming every file already in bids/ and sourcedata/.
  # Every subject file must agree (session: "01" with true, session: null with false).
  sessions: true


# -------------------------------------------------------------------------------------
#  Where the data are
# -------------------------------------------------------------------------------------
#  The pipeline expects this layout (it builds every other path from these two):
#
#    <study folder>/
#    ├── bids/                              <- bids_root: the BIDS dataset (anonymized data only)
#    └── sourcedata/                        <- sourcedata_root
#        ├── code/heuristic.py              <- the MRI naming rules (written by notebook 03)
#        └── sub-01/ses-01/                 <- just sub-01/ when sessions: is false (above)
#            ├── raw/                       <- the files from the lab, as they came (never changed)
#            │   ├── cMEG/                  <- one <prefix>_cMEG_Data folder per recording
#            │   ├── einscan/               <- head digitization files
#            │   ├── eye/                   <- the EyeLink .edf
#            │   ├── mri/                   <- the DICOM files (directly, or in a dcm/ subfolder)
#            │   └── behav/                 <- the PsychoPy .csv logs
#            ├── fif/                       <- notebook 01's FIF files
#            ├── eye-staging/               <- notebook 02's eye2bids output
#            ├── mri-staging/               <- notebook 03's HeuDiConv output
#            ├── defaced_anat/              <- notebook 03's defaced MRI copies (for sharing)
#            └── reports/                   <- the pipeline's HTML reports
#
#  sourcedata_root must NOT be inside bids_root: everything in it can identify the
#  participant (real dates, faces), and only anonymized data go into bids/.
paths:
  sourcedata_root: "/jukebox/[yourpath]/auditory-oddball/sourcedata"
  bids_root: "/jukebox/[yourpath]/auditory-oddball/bids"


# -------------------------------------------------------------------------------------
#  Your software on the cluster
# -------------------------------------------------------------------------------------
#  Each person keeps their own copies of these (they are not shared), so set the paths
#  to yours. The pipeline checks before running that each file exists and starts.
#  The containers are Apptainer/Singularity images (.sif files).
software:
  # HeuDiConv and pydeface (notebook 03). Can be null if mri: is false (data: section below).
  heudiconv_sif: "/jukebox/[yourpath]/singularity-containers/heudiconv/heudiconv-1.5.1.sif"
  pydeface_sif: "/jukebox/[yourpath]/singularity-containers/pydeface/pydeface-2026-08-10.sif"
  # The BIDS validator (notebooks 03 and 06).
  bids_validator_sif: "/jukebox/[yourpath]/singularity-containers/bids-validator/bids-validator-3.0.2.sif"
  # Extra folders to make visible inside the containers, e.g. ["/scratch"]. [] = none.
  extra_binds: []
  # The folder that contains edf2asc (SR Research's EDF reader, used by eye2bids in
  # notebook 02). null = edf2asc is already on your PATH (e.g. after install_edf2asc.sh).
  edf2asc_dir: null


# -------------------------------------------------------------------------------------
#  What was recorded in this study
# -------------------------------------------------------------------------------------
#  Turn off what your study doesn't have; the notebooks that need it are then skipped,
#  and the pipeline doesn't look for those raw folders.
data:
  eye_tracking: true    # raw/eye/ (notebooks 02 and 05)
  mri: true             # raw/mri/ (notebook 03; notebook 04 copies the anatomicals)
  behavioral: true      # raw/behav/ (notebook 04 converts the PsychoPy logs)


# -------------------------------------------------------------------------------------
#  Which notebooks to run
# -------------------------------------------------------------------------------------
#  true = run it. A notebook whose data is turned off above is skipped anyway.
#  Rules the pipeline adds: if 04 runs, 05 runs too (04 rewrites a file 05 completes),
#  and 06 (the final BIDS validation) always runs last.
#  For one run you can also choose on the command line, e.g. ... sub-01.yaml --steps 04,05
steps:
  "01": true    # convert the raw cMEG recordings to FIF, screen for bad channels
  "02": true    # convert the EyeLink .edf with eye2bids
  "03": true    # convert the MRI DICOMs with HeuDiConv, deface copies
  "04": true    # write the MEG (+ MRI and behavioral files) into the BIDS dataset
  "05": true    # sync the eye tracking to the MEG and add it to the BIDS dataset
  "06": true    # validate the whole BIDS dataset


# -------------------------------------------------------------------------------------
#  Options
# -------------------------------------------------------------------------------------
options:
  # true = files that already exist are replaced (in bids/ and in the staging folders).
  overwrite: true

  # true = notebook 01 converts the cMEG recordings again even if the FIF files exist.
  # Set it after fixing a recording prefix or an EinScan file name; otherwise the old FIF is used.
  force_reconvert: false

  # true = notebook 04 writes the dataset-level files: dataset_description.json, README,
  # CHANGES, LICENSE, CITATION.cff, task-<label>_meg.json. Set it for the first subject (or
  # after editing the dataset's description at the end of this file or text/), then set it
  # to false. participants.tsv is always updated, whatever this says.
  write_dataset_files: true

  # How empty-room recordings are stored in BIDS:
  #   "same-session"   next to the task recording, as task-noise (Recommended)
  #   "sub-emptyroom"  in a separate sub-emptyroom/ folder
  emptyroom_layout: "same-session"


# -------------------------------------------------------------------------------------
#  The final BIDS validation (notebook 06)
# -------------------------------------------------------------------------------------
validator:
  ignore_warnings: false    # true = report errors only
  show_text_report: false   # true = also show the validator's own (long) text report
  fail_on_errors: false     # true = mark the run as failed if the validator finds errors


# -------------------------------------------------------------------------------------
#  The HTML reports
# -------------------------------------------------------------------------------------
#  One HTML file per notebook, plus an index page, in <session>/reports/<date-time>/.
report:
  hide_code: true           # true = show only text, tables and figures; false = also the code


# -------------------------------------------------------------------------------------
#  The cluster job (used by run_bids-pipeline.sh)
# -------------------------------------------------------------------------------------
slurm:
  time: "04:00:00"          # maximum run time (hh:mm:ss)
  mem: "32G"                # memory
  cpus: 4                   # CPU cores
  partition: null           # null = the cluster's default partition

  # Email from Slurm about the job. mail_user: your address (null = no email). Each person
  # submitting sets their own. mail_type: when to send, any of
  #   BEGIN (the job starts running), END (it finished), FAIL (it ended with an error:
  #   a notebook failed or was skipped), TIME_LIMIT_80 (80% of the
  #   time used), ALL. Slurm sends no email when the job is only submitted (queued);
  #   run_bids-pipeline.sh prints the job number then.
  mail_user: null           # e.g. "netid@princeton.edu"
  mail_type: ["END", "FAIL"]


# -------------------------------------------------------------------------------------
#  The other configuration files (relative to this folder)
# -------------------------------------------------------------------------------------
#  facility: null = 01-explore-raw-files/bids-pipeline/facility.yaml in pygers-meg (Recommended).
files:
  processing: "processing.yaml"
  private: "private.yaml"
  text_dir: "text"
  facility: null


# -------------------------------------------------------------------------------------
#  Changes to the facility settings for this study only
# -------------------------------------------------------------------------------------
#  Same names and layout as 01-explore-raw-files/bids-pipeline/facility.yaml; only what you set here changes.
#  Example:
#    facility_overrides:
#      meg:
#        line_freq: 50
facility_overrides: {}


# =====================================================================================
#  THE PUBLISHED DATASET'S DESCRIPTION (notebook 04, Section 11)
# =====================================================================================
#
#  Everything from here on describes the BIDS dataset for the people who will use it.
#  It becomes the dataset-level files: dataset_description.json, CITATION.cff, CHANGES,
#  participants.json and task-<label>_meg.json. These are written only when
#  write_dataset_files (in the options: section above) is true. Edit this part when you
#  prepare a release: a new "changes" entry, a new date, new authors.
#
#  The README and LICENSE texts are in text/.
# =====================================================================================


# -------------------------------------------------------------------------------------
#  dataset_description.json (11.1)
# -------------------------------------------------------------------------------------
description:
  name: "Sample auditory oddball OPM-MEG dataset"    # REQUIRED

  # true = the authors, license, how-to-acknowledge and references go in CITATION.cff
  # (Recommended; BIDS then leaves them out of dataset_description.json).
  use_citation_cff: true

  # Used only if use_citation_cff: false. Names as "Given Family".
  authors: []
  how_to_acknowledge: ""

  # The license name: "CC0" (public-domain dedication, the OpenNeuro default; Recommended),
  # or e.g. "CC-BY-4.0", "PDDL". The full text is in text/LICENSE.txt.
  license: "CC0"

  bids_version: "1.11.1"      # the BIDS version the validator checks against (bids-validator 3.0.2)
  keywords: ["MEG", "OPM", "oddball paradigm"]
  acknowledgements: "We would like to thank members of the PNI Pygers-MEG user group with data collection and analysis"
  funding:
    - "Funding for the acquisition of the data was provided by the Regina and John Scully ’66 Center for the Neuroscience of Mind and Behavior."
  ethics_approvals:
    - "Princeton University Institutional Review Board, protocol number 16967"
  doi: ""                     # e.g. "doi:10.18112/openneuro.ds00xxxx.v1.0.0"; "" if none yet

  # Publications describing the data or methods: written to CITATION.cff "references" (or, without
  # CITATION.cff, as DOI links). Authors as "Family, Given".
  references:
    - title: "MEG-BIDS, the brain imaging data structure extended to magnetoencephalography"
      authors: ["Niso, G.", "Gorgolewski, K. J.", "Bock, E.", "Brooks, T. L.", "Flandin, G.", "Gramfort, A.",
                "Henson, R. N.", "Jas, M.", "Litvak, V.", "Moreau, J.", "Oostenveld, R.", "Schoffelen, J.",
                "Tadel, F.", "Wexler, J.", "Baillet, S."]
      journal: "Scientific Data"
      year: 2018
      doi: "10.1038/sdata.2018.110"
    - title: "MNE-BIDS: Organizing electrophysiological data into the BIDS format and facilitating their analysis"
      authors: ["Appelhoff, S.", "Sanderson, M.", "Brooks, T.", "Vliet, M.", "Quentin, R.", "Holdgraf, C.",
                "Chaumon, M.", "Mikulan, E.", "Tavabi, K.", "Höchenberger, R.", "Welke, D.", "Brunner, C.",
                "Rockhill, A.", "Larson, E.", "Gramfort, A.", "Jas, M."]
      journal: "Journal of Open Source Software"
      year: 2019
      doi: "10.21105/joss.01896"
    - title: "FieldTrip: Open source software for advanced analysis of MEG, EEG, and invasive electrophysiological data"
      authors: ["Oostenveld, R.", "Fries, P.", "Maris, E.", "Schoffelen, J.-M."]
      journal: "Computational Intelligence and Neuroscience"
      year: 2011
      doi: "10.1155/2011/156869"
    - title: "Two varieties of long-latency positive waves evoked by unpredictable auditory stimuli in man"
      authors: ["Squires, N. K.", "Squires, K. C.", "Hillyard, S. A."]
      journal: "Electroencephalography and Clinical Neurophysiology"
      year: 1975
      doi: "10.1016/0013-4694(75)90263-1"
    - title: "Evoked-potential correlates of stimulus uncertainty"
      authors: ["Sutton, S.", "Braren, M.", "Zubin, J.", "John, E. R."]
      journal: "Science"
      year: 1965
      doi: "10.1126/science.150.3700.1187"
    - title: "MEG studies of sensorimotor rhythms: A review"
      authors: ["Cheyne, D. O."]
      journal: "Experimental Neurology"
      year: 2013
      doi: "10.1016/j.expneurol.2012.08.030"
    - title: "The mismatch negativity (MMN) in basic research of central auditory processing: a review"
      authors: ["Näätänen, R.", "Paavilainen, P.", "Rinne, T.", "Alho, K."]
      journal: "Clinical Neurophysiology"
      year: 2007
      doi: "10.1016/j.clinph.2007.04.026"


# -------------------------------------------------------------------------------------
#  CITATION.cff (11.4c): how people cite the dataset
# -------------------------------------------------------------------------------------
citation:
  # One entry per author. orcid as a full URL, e.g. "https://orcid.org/0000-0000-0000-0000",
  # or "" if none.
  authors:
    - family-names: "EDIT ME"
      given-names: "EDIT ME"
      affiliation: "EDIT ME: Institution"
      orcid: ""
  message: "If you use this dataset, please cite it using the metadata from this file."
  # A paper to cite instead of the dataset, e.g. {type: article, title: "...", journal: "...",
  # year: 2027, doi: "..."}. null = none.
  preferred_paper: null


# -------------------------------------------------------------------------------------
#  CHANGES (11.4a): the dataset's version history, newest first
# -------------------------------------------------------------------------------------
#  The newest entry's version and date are also the version and release date in
#  CITATION.cff. A version already in CHANGES keeps its heading; only new lines are added.
#  Lines may use {mne_version} and {mne_bids_version}.
changes:
  - version: "1.0.0"
    date: "EDIT ME"             # release date, e.g. "2026-11-01"
    items:
      - "Initial release."
      - "Converted with MNE {mne_version} / MNE-BIDS {mne_bids_version}."


# -------------------------------------------------------------------------------------
#  participants.json (11.3): a description of every column of participants.tsv
# -------------------------------------------------------------------------------------
#  Each subject file gives its participant's values (participant: in subjects/sub-XX.yaml);
#  every column used there must be described here.
participants_columns:
  participant_id:
    Description: "Unique participant identifier (matches the sub- folder name)."
  age:
    Description: "Age of the participant at the time of the MEG recording."
    Units: "year"
  sex:
    Description: "Sex of the participant as reported by the participant."
    Levels: {male: "male", female: "female", other: "other"}
  handedness:
    Description: "Self-reported handedness."
    Levels: {left: "left", right: "right", ambidextrous: "ambidextrous"}


# -------------------------------------------------------------------------------------
#  task-<label>_meg.json (11.4d): task fields shared by every recording of the task
# -------------------------------------------------------------------------------------
task_sidecar:
  write: true
  cog_atlas_id: ""     # Cognitive Atlas task ID (URL), "" if none
  cog_po_id: ""        # CogPO paradigm ID (URL), "" if none
